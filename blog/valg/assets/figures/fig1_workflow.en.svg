<rect x="540" y="214" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="650.0" y="249" font-size="19" font-weight="700" text-anchor="middle">03 Global diagnostic</text><text x="650.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">does it compose?</text>
<rect x="800" y="214" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="910.0" y="249" font-size="19" font-weight="700" text-anchor="middle">04 Global check</text><text x="910.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">viability, obstacles</text>
<rect x="800" y="306" width="220" height="28" rx="5" fill="#fbf3f0" stroke="#d9a593"/><text x="910.0" y="325" font-size="14" font-weight="700" fill="#9b3f28" text-anchor="middle">return to: global / sketch / idea</text>
<rect x="800" y="372" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="910.0" y="407" font-size="19" font-weight="700" text-anchor="middle">05 Step proofs</text><text x="910.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">in dependency order</text>
<rect x="540" y="372" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="650.0" y="407" font-size="19" font-weight="700" text-anchor="middle">06 Step checks</text><text x="650.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">each step separately</text>
<rect x="540" y="464" width="220" height="28" rx="5" fill="#fbf3f0" stroke="#d9a593"/><text x="650.0" y="483" font-size="14" font-weight="700" fill="#9b3f28" text-anchor="middle">return to: step / dep. / sketch</text>
<rect x="280" y="372" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="390.0" y="407" font-size="19" font-weight="700" text-anchor="middle">07 Assembly</text><text x="390.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">full manuscript</text>
<rect x="20" y="372" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="130.0" y="407" font-size="19" font-weight="700" text-anchor="middle">08 Final checks</text><text x="130.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">struct. · rigor · cite · counterex.</text>
<rect x="20" y="530" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="130.0" y="565" font-size="19" font-weight="700" text-anchor="middle">09 Combined verdict</text><text x="130.0" y="592" font-size="15.5" fill="#55657a" text-anchor="middle">merges the four</text>
