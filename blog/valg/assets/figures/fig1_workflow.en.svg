<rect x="364" y="48" width="158" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="443.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">02 Perspectives</text><text x="443.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">≤ 3, distinct</text>
