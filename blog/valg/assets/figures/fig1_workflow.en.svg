<text x="170" y="196" font-size="21" font-weight="700" fill="#285b91">Workflow 2 · Staged proof and checking for every branch</text>
<rect x="20" y="214" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="130.0" y="249" font-size="19" font-weight="700" text-anchor="middle">01 Proof sketch</text><text x="130.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">typed dependency DAG</text>
<rect x="280" y="214" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="390.0" y="249" font-size="19" font-weight="700" text-anchor="middle">02 Sketch check</text><text x="390.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">is the route viable?</text>
