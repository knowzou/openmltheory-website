<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" role="img"><title>VALG workflow</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#6b7a86"/></marker></defs>
<rect width="1060" height="700" fill="#fff"/><g font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" fill="#22384d">
<text x="10" y="28" font-size="21" font-weight="700" fill="#285b91">工作流一 · 把研究方向收敛成定理契约</text>
<rect x="12" y="48" width="158" height="84" rx="9" fill="#f3f7fb" stroke="#4f78a3" stroke-width="2"/><text x="91.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">输入</text><text x="91.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">研究方向与问题陈述</text>
<rect x="188" y="48" width="158" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="267.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">01 文献整理</text><text x="267.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">设定、结果、缺口</text>
<rect x="364" y="48" width="158" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="443.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">02 视角选择</text><text x="443.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">至多 3 条、彼此不同</text>
<rect x="540" y="48" width="158" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="619.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">03 idea 生成</text><text x="619.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">机制、依据、查重</text>
<rect x="716" y="48" width="158" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="795.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">04 形式化</text><text x="795.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">对象、假设、唯一目标</text>
<rect x="892" y="48" width="158" height="84" rx="9" fill="#f3f7fb" stroke="#4f78a3" stroke-width="2" stroke-dasharray="7 5"/><text x="971.0" y="83" font-size="17.5" font-weight="700" text-anchor="middle">定理契约</text><text x="971.0" y="110" font-size="14" fill="#55657a" text-anchor="middle">证明阶段不可修改</text>
