<rect x="670" y="548" width="18" height="18" rx="4" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="696" y="563" font-size="15.5">审查</text>
<rect x="780" y="548" width="18" height="18" rx="4" fill="#eef7f0" stroke="#2e7d4f" stroke-width="2"/><text x="806" y="563" font-size="15.5">接受</text>
