<text x="883.0" y="80.0" font-size="15" fill="#285b91" text-anchor="middle">✓</text>
<path d="M971.0 132V168H110V206" fill="none" stroke="#6b7a86" stroke-width="2" marker-end="url(#a)"/>
<text x="170" y="196" font-size="21" font-weight="700" fill="#285b91">工作流二 · 对每个分支分阶段证明与审查</text>
<rect x="20" y="214" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="130.0" y="249" font-size="19" font-weight="700" text-anchor="middle">01 证明草图</text><text x="130.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">有类型的依赖图</text>
<rect x="280" y="214" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="390.0" y="249" font-size="19" font-weight="700" text-anchor="middle">02 草图审查</text><text x="390.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">路线是否可行</text>
<rect x="280" y="306" width="220" height="28" rx="5" fill="#fbf3f0" stroke="#d9a593"/><text x="390.0" y="325" font-size="14" font-weight="700" fill="#9b3f28" text-anchor="middle">返回：草图 / idea</text>
<rect x="540" y="214" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="650.0" y="249" font-size="19" font-weight="700" text-anchor="middle">03 全局诊断</text><text x="650.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">整条定理能否组合</text>
<rect x="800" y="214" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="910.0" y="249" font-size="19" font-weight="700" text-anchor="middle">04 全局审查</text><text x="910.0" y="276" font-size="15.5" fill="#55657a" text-anchor="middle">可行性与障碍</text>
<rect x="800" y="306" width="220" height="28" rx="5" fill="#fbf3f0" stroke="#d9a593"/><text x="910.0" y="325" font-size="14" font-weight="700" fill="#9b3f28" text-anchor="middle">返回：全局诊断 / 草图 / idea</text>
<rect x="800" y="372" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="910.0" y="407" font-size="19" font-weight="700" text-anchor="middle">05 步骤证明</text><text x="910.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">按依赖顺序逐个证明</text>
<rect x="540" y="372" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="650.0" y="407" font-size="19" font-weight="700" text-anchor="middle">06 步骤审查</text><text x="650.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">逐步独立审查</text>
<rect x="540" y="464" width="220" height="28" rx="5" fill="#fbf3f0" stroke="#d9a593"/><text x="650.0" y="483" font-size="14" font-weight="700" fill="#9b3f28" text-anchor="middle">返回：步骤 / 依赖 / 草图</text>
<rect x="280" y="372" width="220" height="84" rx="9" fill="#f2f8f7" stroke="#3d8a7e" stroke-width="2"/><text x="390.0" y="407" font-size="19" font-weight="700" text-anchor="middle">07 证明装配</text><text x="390.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">连成完整稿件</text>
<rect x="20" y="372" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="130.0" y="407" font-size="19" font-weight="700" text-anchor="middle">08 分项终审</text><text x="130.0" y="434" font-size="15.5" fill="#55657a" text-anchor="middle">结构 · 严谨 · 引用 · 反例</text>
<rect x="20" y="530" width="220" height="84" rx="9" fill="#fcf6ee" stroke="#c58a3c" stroke-width="2"/><text x="130.0" y="565" font-size="19" font-weight="700" text-anchor="middle">09 汇总终审</text><text x="130.0" y="592" font-size="15.5" fill="#55657a" text-anchor="middle">综合四份意见</text>
<rect x="20" y="622" width="250" height="28" rx="5" fill="#fbf3f0" stroke="#d9a593"/><text x="145.0" y="641" font-size="14" font-weight="700" fill="#9b3f28" text-anchor="middle">返回：装配 / 步骤 / 草图 / idea</text>
<rect x="280" y="530" width="220" height="84" rx="9" fill="#eef7f0" stroke="#2e7d4f" stroke-width="2"/><text x="390.0" y="565" font-size="19" font-weight="700" text-anchor="middle">10 接受</text><text x="390.0" y="592" font-size="15.5" fill="#55657a" text-anchor="middle">评分 ≥ 7 且无未决问题</text>
